<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>我的健身重量记录</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --accent: #d0021b;
    --border: #e5e5ea;
    --chip-bg: #eef0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --sub: #98989d;
      --accent: #ff453a;
      --border: #2c2c2e;
      --chip-bg: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 60px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--sub);
    font-size: 0.85rem;
    margin: 0;
  }
  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    margin: 16px 0 24px;
    -webkit-appearance: none;
  }
  #search:focus {
    outline: 2px solid var(--accent);
  }
  .group-title {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sub);
    margin: 24px 4px 10px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .card .name {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .card .tag {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--sub);
    background: var(--chip-bg);
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .card .weight {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .card .weight span {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--sub);
    margin-left: 2px;
  }
  #empty {
    display: none;
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
  }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 0.75rem;
    margin-top: 36px;
  }
</style>
</head>
<body>

<header>
  <h1>🏋️ 我的健身重量记录</h1>
  <p class="sub">走到器材前，搜一下名字，马上知道上次做多少公斤</p>
</header>

<input type="text" id="search" placeholder="搜索器材名字，例如 leg / chest / row…" autocomplete="off">

<div id="list"></div>
<p id="empty">没找到相符的器材</p>

<footer>Precor 器材 · 最后更新 2026-07-30</footer>

<script>
  const DATA = [
    { name: "Leg Press", zh: "腿举", weight: 54, category: "下半身 Lower Body" },
    { name: "Leg Extension / Leg Curl", zh: "腿屈伸 / 腿弯举", weight: 41, category: "下半身 Lower Body" },
    { name: "Inner / Outer Thigh", zh: "大腿内外侧", weight: 32, category: "下半身 Lower Body" },
    { name: "Glute Extension", zh: "臀部伸展", weight: 23, category: "下半身 Lower Body" },
    { name: "Diverging Seated Row", zh: "坐姿划船", weight: 45, category: "上半身 Upper Body" },
    { name: "Converging Chest Press", zh: "夹胸推举", weight: 32, category: "上半身 Upper Body" },
    { name: "Multi-Press", zh: "多功能推举", weight: 32, category: "上半身 Upper Body" },
    { name: "Rear Delt / Pec Fly", zh: "后三角 / 蝴蝶夹胸", weight: 32, category: "上半身 Upper Body" },
    { name: "Lateral Raise", zh: "侧平举", weight: 27, category: "上半身 Upper Body" },
    { name: "Biceps Curl / Triceps Extension", zh: "二头弯举 / 三头伸展", weight: 23, category: "上半身 Upper Body" },
  ];

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");

  function render(filter) {
    const q = (filter || "").trim().toLowerCase();
    const groups = {};
    DATA.forEach(item => {
      const hay = (item.name + " " + item.zh).toLowerCase();
      if (q && !hay.includes(q)) return;
      if (!groups[item.category]) groups[item.category] = [];
      groups[item.category].push(item);
    });

    listEl.innerHTML = "";
    const categories = Object.keys(groups);
    categories.forEach(cat => {
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = cat;
      listEl.appendChild(title);

      groups[cat].forEach(item => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <div class="name">${item.name}</div>
            <span class="tag">${item.zh}</span>
          </div>
          <div class="weight">${item.weight}<span>kg</span></div>
        `;
        listEl.appendChild(card);
      });
    });

    emptyEl.style.display = categories.length === 0 ? "block" : "none";
  }

  searchEl.addEventListener("input", e => render(e.target.value));
  render("");
</script>

</body>
</html>
