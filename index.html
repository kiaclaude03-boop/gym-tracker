<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>我的健身重量记录</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --sub: #6e6e73;
    --accent: #d0021b;
    --border: #e5e5ea;
    --chip-bg: #eef0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --sub: #98989d;
      --accent: #ff453a;
      --border: #2c2c2e;
      --chip-bg: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 60px;
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--sub);
    font-size: 0.85rem;
    margin: 0;
  }
  #search {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    margin: 16px 0 24px;
    -webkit-appearance: none;
  }
  #search:focus {
    outline: 2px solid var(--accent);
  }
  .group-title {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--sub);
    margin: 24px 4px 10px;
  }
  #progress-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4px 4px 0;
  }
  #progress-text {
    font-size: 0.85rem;
    color: var(--sub);
    font-weight: 600;
  }
  #reset-btn {
    font-size: 0.78rem;
    color: var(--sub);
    background: var(--chip-bg);
    border: none;
    padding: 6px 12px;
    border-radius: 999px;
    -webkit-appearance: none;
  }
  #reset-btn:active {
    opacity: 0.7;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
  }
  .card-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    position: relative;
  }
  .check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check.checked::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }
  .card.done {
    opacity: 0.55;
  }
  .card.done .name {
    text-decoration: line-through;
  }
  .card .name {
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.3;
  }
  .card .tag {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--sub);
    background: var(--chip-bg);
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .card .weight {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .card .weight span {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--sub);
    margin-left: 2px;
  }
  .card.archived {
    opacity: 0.5;
  }
  .card .tag.archived-tag {
    background: none;
    border: 1px solid var(--border);
  }
  #empty {
    display: none;
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
  }
  footer {
    text-align: center;
    color: var(--sub);
    font-size: 0.75rem;
    margin-top: 36px;
  }
</style>
</head>
<body>

<header>
  <h1>🏋️ 我的健身重量记录</h1>
  <p class="sub">走到器材前，搜一下名字，马上知道上次做多少公斤</p>
</header>

<input type="text" id="search" placeholder="搜索器材名字，例如 leg / chest / row…" autocomplete="off">

<div id="progress-bar">
  <span id="progress-text"></span>
  <button id="reset-btn" type="button">重置 Reset</button>
</div>

<div id="list"></div>
<p id="empty">没找到相符的器材</p>

<footer>Precor 器材 · 最后更新 2026-08-03</footer>

<script>
  const DATA = [
    { name: "Leg Press", zh: "腿举", weight: 54, category: "下半身 Lower Body", active: true },
    { name: "Leg Curl", zh: "腿弯举", weight: 59, category: "下半身 Lower Body", active: true },
    { name: "Glute Extension", zh: "臀部伸展", weight: 32, category: "下半身 Lower Body", active: true },
    { name: "Diverging Seated Row", zh: "坐姿划船", weight: 50, category: "上半身 Upper Body", active: true },
    { name: "Diverging Lat Pulldown", zh: "高位下拉", weight: 45, category: "上半身 Upper Body", active: true },
    { name: "Converging Chest Press", zh: "夹胸推举", weight: 32, category: "上半身 Upper Body", active: true },
    { name: "Multi-Press", zh: "多功能推举", weight: 32, category: "上半身 Upper Body", active: true },
    { name: "Rear Delt", zh: "后三角", weight: 32, category: "上半身 Upper Body", active: true },

    { name: "Leg Extension", zh: "腿屈伸", weight: 59, category: "下半身 Lower Body", active: false },
    { name: "Inner Thigh", zh: "大腿内侧", weight: 36, category: "下半身 Lower Body", active: false },
    { name: "Outer Thigh", zh: "大腿外侧", weight: 32, category: "下半身 Lower Body", active: false },
    { name: "Pec Fly", zh: "蝴蝶夹胸", weight: 32, category: "上半身 Upper Body", active: false },
    { name: "Lateral Raise", zh: "侧平举", weight: 27, category: "上半身 Upper Body", active: false },
    { name: "Biceps Curl / Triceps Extension", zh: "二头弯举 / 三头伸展", weight: 23, category: "上半身 Upper Body", active: false },
  ];

  const listEl = document.getElementById("list");
  const emptyEl = document.getElementById("empty");
  const searchEl = document.getElementById("search");
  const progressText = document.getElementById("progress-text");
  const resetBtn = document.getElementById("reset-btn");

  const CHECKED_KEY = "gymChecked";
  const CHECKED_DATE_KEY = "gymCheckedDate";

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  function loadChecked() {
    if (localStorage.getItem(CHECKED_DATE_KEY) !== todayStr()) {
      return new Set();
    }
    try {
      return new Set(JSON.parse(localStorage.getItem(CHECKED_KEY) || "[]"));
    } catch (e) {
      return new Set();
    }
  }

  function saveChecked() {
    localStorage.setItem(CHECKED_DATE_KEY, todayStr());
    localStorage.setItem(CHECKED_KEY, JSON.stringify([...checked]));
  }

  let checked = loadChecked();

  function renderCard(item) {
    const isChecked = item.active && checked.has(item.name);
    const card = document.createElement("div");
    card.className = item.active ? "card" : "card archived";
    if (isChecked) card.className += " done";
    card.innerHTML = `
      <div class="card-left">
        ${item.active ? `<span class="check${isChecked ? " checked" : ""}"></span>` : ""}
        <div>
          <div class="name">${item.name}</div>
          <span class="tag${item.active ? "" : " archived-tag"}">${item.zh}${item.active ? "" : " · 已归档"}</span>
        </div>
      </div>
      <div class="weight">${item.weight}<span>kg</span></div>
    `;
    if (item.active) {
      card.addEventListener("click", () => {
        if (checked.has(item.name)) checked.delete(item.name);
        else checked.add(item.name);
        saveChecked();
        render(searchEl.value);
      });
    }
    return card;
  }

  function render(filter) {
    const q = (filter || "").trim().toLowerCase();
    const matches = DATA.filter(item => {
      const hay = (item.name + " " + item.zh).toLowerCase();
      return !q || hay.includes(q);
    });

    listEl.innerHTML = "";

    const active = matches.filter(item => item.active);
    const archived = matches.filter(item => !item.active);

    const groups = {};
    active.forEach(item => {
      if (!groups[item.category]) groups[item.category] = [];
      groups[item.category].push(item);
    });
    Object.keys(groups).forEach(cat => {
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = cat;
      listEl.appendChild(title);
      groups[cat].forEach(item => listEl.appendChild(renderCard(item)));
    });

    if (archived.length) {
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = "📦 已归档 Archived（暂不练，数据保留）";
      listEl.appendChild(title);
      archived.forEach(item => listEl.appendChild(renderCard(item)));
    }

    emptyEl.style.display = matches.length === 0 ? "block" : "none";

    const activeAll = DATA.filter(item => item.active);
    const doneCount = activeAll.filter(item => checked.has(item.name)).length;
    progressText.textContent = `今天已完成 ${doneCount} / ${activeAll.length}`;
  }

  searchEl.addEventListener("input", e => render(e.target.value));
  resetBtn.addEventListener("click", () => {
    checked = new Set();
    saveChecked();
    render(searchEl.value);
  });
  render("");
</script>

</body>
</html>
